name: Release Build

on:
  push:
  pull_request:

jobs:
  build:
    name: build checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build
        run: python script/build_extension.py --sync-remote

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: ./release
